name: Texts

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  # A · Posts the English/German table as a comment on the pull request
  i18n-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get the texts from the base branch
        run: |
          mkdir -p base
          for f in en de meta types; do
            git show "origin/${{ github.base_ref }}:src/i18n/$f.ts" > "base/$f.ts" 2>/dev/null || rm -f "base/$f.ts"
          done
      - name: Build the text table
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node --experimental-strip-types --no-warnings scripts/i18n-report.mjs base src/i18n
      - name: Post or update the comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.body.includes('<!-- i18n-review -->'));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else if (!body.includes('No text changes')) await github.rest.issues.createComment({ owner, repo, issue_number, body });

  # B · Missing keys, empty texts, length limits, TypeScript types
  i18n-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type check (every English key must exist in German)
        run: npm install --no-audit --no-fund && npx tsc --noEmit
      - name: Get the texts from the base branch
        run: |
          mkdir -p base
          for f in en de meta types; do
            git show "origin/${{ github.base_ref }}:src/i18n/$f.ts" > "base/$f.ts" 2>/dev/null || rm -f "base/$f.ts"
          done
      - name: Check lengths and empty texts
        run: node --experimental-strip-types --no-warnings scripts/i18n-report.mjs base src/i18n --check

  # C · The text team may only change files in src/i18n/
  path-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check which files the text team changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Read the team list from the base branch so a PR cannot change it
          team=$(git show "$BASE:.github/text-team.txt" | grep -v '^#' | tr -d '\r' | xargs)
          outside=$(git diff --name-only "$BASE...$HEAD" | grep -v '^src/i18n/' || true)
          if [ -z "$outside" ]; then echo "Only text files changed."; exit 0; fi
          bad=""
          for row in $(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate --jq '.[] | "\(.sha),\(.author.login // "unknown")"'); do
            sha=${row%%,*}; login=${row#*,}
            for member in $team; do
              [ "$login" = "$member" ] || continue
              files=$(git diff-tree --no-commit-id --name-only -r "$sha")
              for f in $outside; do
                if echo "$files" | grep -qx "$f"; then bad="$bad\n  - $f (changed by $login in ${sha:0:7})"; fi
              done
            done
          done
          if [ -n "$bad" ]; then
            echo -e "::error::Text team members may only change files in src/i18n/.$bad"
            exit 1
          fi
          echo "No text-team changes outside src/i18n/."
